name: goutoujunshi
version: 1.6.1
description: "Fail-closed Feishu adviser with isolated MySQL relationship memory and enriched MySQL retrieval."
author: local
kind: standalone
requires_env:
  - GOUTOUJUNSHI_DB_PASSWORD
  - GOUTOUJUNSHI_OWNER_ID
provides_tools:
  - relationship_commit_turn
  - relationship_search_events
  - user_memory_remember
  - user_memory_correct
  - user_memory_forget
hooks:
  - pre_gateway_dispatch
  - post_llm_call
  - on_session_end
