name: goutoujunshi
version: 1.8.0
description: "Fail-closed Feishu adviser with isolated MySQL relationship memory and privacy-bounded web search."
author: local
kind: standalone
requires_env:
  - GOUTOUJUNSHI_DB_PASSWORD
  - GOUTOUJUNSHI_OWNER_ID
provides_tools:
  - relationship_commit_turn
  - relationship_search_events
  - relationship_web_search
  - user_memory_remember
  - user_memory_correct
  - user_memory_forget
hooks:
  - pre_gateway_dispatch
  - post_gateway_session
  - post_llm_call
  - on_session_end
